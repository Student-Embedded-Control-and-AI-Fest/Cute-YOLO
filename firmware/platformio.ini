[env:esp32-s3-camera-cute-ble]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.flash_size = 16MB
board_build.partitions = partitions_16mb_cute_ble.csv

build_src_filter =
  -<*>
  +<cute_main.cpp>
  +<cute_model_manager.cpp>
  +<noodle_serial.cpp>

lib_deps =
  symlink:///home/auralius/works/noodle
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ST7735 and ST7789 Library
  adafruit/Adafruit BusIO
  h2zero/NimBLE-Arduino

build_flags =
  -D BOARD_HAS_PSRAM
  -D NOODLE_USE_NONE
  -D NOODLE_POOL_MODE=NOODLE_POOL_MAX
  -D NOODLE_MAX_K=5
  -D NOODLE_FCN_BLOCK=128
  -D NOODLE_USE_INT8
  -D NOODLE_BUFFER_ARENA_INITIAL_BYTES=102400
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

upload_protocol = esptool
monitor_speed = 921600
monitor_filters = direct
